[build]
  command = "npm run build"
  publish = "dist"

# SPA Routing: Redirect all routes to index.html with 200 status
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache immutable assets in Vite's dist/assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
